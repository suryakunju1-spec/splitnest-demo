<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SplitNest · Dashboard</title><link rel="stylesheet" href="css/app.css">
<script src="https://cdn.jsdelivr.net/npm/lodash@4.17.15/lodash.min.js"></script></head>
<body><header><div class="logo">Split<span>Nest</span></div><nav><a href="activity.html">Activity</a><a href="index.html">Home</a></nav></header>
<main><div id="note" class="card" style="display:none"></div>
<div class="card"><h2 id="title" style="margin-top:0">Your household</h2><table id="bills"></table></div>
<p class="muted">SplitNest is a made-up demo app for a YouTube video. All names and numbers are invented.</p></main>
<script>
const q = new URLSearchParams(location.search);
// A message from a roommate, shown as HTML straight from the link.
if (q.get('note')) { const n = document.getElementById('note'); n.style.display = 'block'; n.innerHTML = 'Message from your roommate: ' + q.get('note'); }
const apiUrl = q.has('flat') ? '/api/household?flat=' + encodeURIComponent(q.get('flat')) : '/api/household';
fetch(apiUrl, { credentials: 'same-origin' }).then(async r => {
  if (r.status === 401) {
    location.replace('login.html?next=' + encodeURIComponent(location.pathname + location.search));
    return null;
  }
  if (r.status === 403) {
    document.getElementById('title').textContent = 'Access denied';
    document.getElementById('bills').replaceChildren();
    return null;
  }
  if (!r.ok) {
    document.getElementById('bills').replaceChildren();
    return null;
  }
  return r.json();
}).then(household => {
  if (!household) return;
  document.getElementById('title').textContent = 'Flat ' + household.flat;
  const table = document.getElementById('bills');
  table.replaceChildren();
  const headerRow = document.createElement('tr');
  for (const label of ['Flat', 'Roommate', 'Email', 'Paid', 'Card']) {
    const th = document.createElement('th');
    th.textContent = label;
    headerRow.appendChild(th);
  }
  table.appendChild(headerRow);
  for (const p of (household.payments || [])) {
    const tr = document.createElement('tr');
    for (const value of [household.flat, p.name, p.email, '$' + p.amount, p.card]) {
      const td = document.createElement('td');
      td.textContent = value;
      tr.appendChild(td);
    }
    table.appendChild(tr);
  }
}).catch(() => {
  document.getElementById('bills').replaceChildren();
});
</script></body></html>
